# Every value comes from an environment variable; the defaults match ecommerce-infra
# (docker compose) for local development.
spring:
  application:
    name: ecommerce-inventory
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/inventory}
    username: ${DB_USERNAME:inventory_user}
    password: ${DB_PASSWORD:inventory_pass}

  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by Flyway; Hibernate only checks that the mapping matches it.
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:inventory-service}
      auto-offset-reset: earliest
      # Offsets are committed by the listener only after the database save (Principle VIII).
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        # Bound how long a send may block waiting for metadata when Kafka is down.
        max.block.ms: ${KAFKA_PRODUCER_MAX_BLOCK_MS:10000}
        # Bound the whole send so a synchronous publish stays far below max.poll.interval.ms.
        delivery.timeout.ms: 15000
        request.timeout.ms: 5000
    listener:
      # MANUAL_IMMEDIATE is required for DefaultErrorHandler.setCommitRecovered(true): Spring Kafka
      # ignores commitRecovered for any other ack mode, which would leave dead-lettered offsets
      # uncommitted (research R6).
      ack-mode: manual_immediate
      # Containers are not started during context refresh; KafkaListenerStarter starts them in the
      # background once the application is ready, so startup never waits for Kafka.
      auto-startup: false
      missing-topics-fatal: false
    admin:
      # Topics are created by ecommerce-infra (kafka-init); never connect to the broker at boot.
      auto-create: false
      fail-fast: false

inventory:
  kafka:
    topics:
      order-placed: ${KAFKA_TOPIC_ORDER_PLACED:orders.order-placed}
      stock-reserved: ${KAFKA_TOPIC_STOCK_RESERVED:inventory.stock-reserved}
      stock-rejected: ${KAFKA_TOPIC_STOCK_REJECTED:inventory.stock-rejected}
    # Inbound retries before a message is dead-lettered (research R6).
    consumer-retry:
      max-retries: 3
      initial-interval: 1s
      multiplier: 2.0
      max-interval: 10s
    # Maximum time a synchronous publish waits for the broker acknowledgement (research R7).
    publish-timeout: 15s
  outbound-dead-letter:
    first-retry-delay: 30s
  stock:
    # Upper bound on waiting for stock row locks (ADR 0002, research R2).
    lock-timeout: 5s

server:
  port: ${SERVER_PORT:8081}  # 8080 is taken by kafka-ui in ecommerce-infra
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
